services:
  family-wallet:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8788"
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${PORT:-8788}:8788"
    volumes:
      - family_data:/data

volumes:
  family_data:
