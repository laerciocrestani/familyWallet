name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oracle
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/laerciocrestani/family-wallet:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Enviar o projeto e subir o container
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          AURUM_TOKEN: ${{ secrets.AURUM_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          test -n "$AURUM_TOKEN"
          test -n "$GHCR_TOKEN"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          ssh_cmd="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"
          target="$ORACLE_USER@$ORACLE_HOST"
          remote_dir="/home/ubuntu/family-wallet"

          $ssh_cmd "$target" "mkdir -p '$remote_dir'"

          tar -czf - \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude data \
            --exclude .env \
            . | $ssh_cmd "$target" "tar -xzf - -C '$remote_dir'"

          umask 077
          cat > /tmp/family.env << EOF
          AURUM_TOKEN=$AURUM_TOKEN
          PORT=8788
          HOST=127.0.0.1
          DATA_DIR=data
          EOF
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes /tmp/family.env "$target:$remote_dir/.env"
          rm -f /tmp/family.env

          printf '%s' "$GHCR_TOKEN" | $ssh_cmd "$target" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          $ssh_cmd "$target" "cd '$remote_dir' && chmod 600 .env && docker compose -f docker-compose.yml -f docker-compose.oracle.yml pull && docker compose -f docker-compose.yml -f docker-compose.oracle.yml up -d --no-build --wait && docker logout ghcr.io && curl -fsS http://127.0.0.1:8788/api/health"
